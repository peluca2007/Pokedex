<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="public/favicon-16x16.png" type="image/png" sizes="16x16">
    <title>Pokedex</title>
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    
<main>

<img 
    class="pokemon-image"
    alt="">

<h1 class="pokemon-data">
    <span class="pokemon-number"></span> -
    <span class="pokemon-name"></span>
</h1>


<form class="form">
<input type="search"
class="input-search"
placeholder="Nome ou número "
required>
</form>

<div class="buttons">
    <button class="btn-prev" id="prev">Anterior</button>
    <button class="btn-next" id="next">Próximo</button>
</div>



<img src="public/pokedex.png" alt="Pokedex" class="pokedex"></img>
</main>

</body>

<script src="js/script.js"></script>
</html>
